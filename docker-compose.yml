services:
  nginx:
    image: nginx:1.27-alpine
    container_name: hostinger-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./site:/usr/share/nginx/html:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./letsencrypt:/etc/letsencrypt:ro
    networks:
      - proxy
    healthcheck:
      test:
        ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Shared vector DB. Apps on the proxy network reach it as
  # http://hostinger-qdrant:6333. No ports published: Qdrant has no auth by default.
  qdrant:
    image: qdrant/qdrant:latest
    container_name: hostinger-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - proxy

volumes:
  qdrant_storage:

networks:
  # Shared with app stacks (next-rag, aam, ...). Create once on the VPS:
  #   docker network create proxy
  proxy:
    external: true

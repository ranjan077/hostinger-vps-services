# =========================================================
# AAM FRONTEND - HTTP
# =========================================================

server {
    listen 80;
    server_name aam.ranjandev.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


# =========================================================
# AAM FRONTEND - HTTPS
# =========================================================

server {
    listen 443 ssl;
    server_name aam.ranjandev.tech;

    ssl_certificate /etc/letsencrypt/live/aam.ranjandev.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aam.ranjandev.tech/privkey.pem;

    location / {
        set $upstream http://aam-frontend:3000;
        proxy_pass $upstream;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}


# AAM API - HTTP
server {
    listen 80;
    server_name api.aam.ranjandev.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


# AAM API - HTTPS
server {
    listen 443 ssl;
    server_name api.aam.ranjandev.tech;

    ssl_certificate /etc/letsencrypt/live/api.aam.ranjandev.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.aam.ranjandev.tech/privkey.pem;

    # Allow large uploads (nginx default is 1m)
    client_max_body_size 50m;

    location / {
        set $upstream http://aam-backend:8000;
        proxy_pass $upstream;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
